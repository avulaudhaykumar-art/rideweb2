<section class="booking-page">

<h1>

Book Your Ride

</h1>

<p>

Choose pickup, destination and vehicle.

</p>

<div class="booking-container">

<div class="booking-form">

<h2>

Ride Details

</h2>

<div class="inputBox">

<label>

Pickup Location

</label>

<input
type="text"
placeholder="Enter Pickup Location">

</div>

<div class="inputBox">

<label>

Destination

</label>

<input
type="text"
placeholder="Enter Destination">

</div>

<div class="inputBox">

<label>

Date

</label>

<input
type="date">

</div>

<div class="inputBox">

<label>

Time

</label>

<input
type="time">

</div>

<div class="inputBox">

<label>

Vehicle Type

</label>

<select id="vehicle">

<option>Bike</option>

<option>Auto</option>

<option>Mini</option>

<option>Sedan</option>

<option>SUV</option>

</select>

</div>

<div class="inputBox">

<label>

Passengers

</label>

<select>

<option>1</option>

<option>2</option>

<option>3</option>

<option>4</option>

<option>5+</option>

</select>

</div>
