<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platform Settings - Smart Rideshare SuperAdmin</title>
    <link rel="stylesheet" href="../assets/css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="logo">
            <h2>Smart<span>Rideshare</span></h2>
        </div>
        <div class="admin-profile">
            <img src="../assets/images/profile.jpg" alt="Admin Profile">
            <div>
                <h3>Super Admin</h3>
                <p>Configuration</p>
            </div>
        </div>
    </header>

    <section>
        <h2><i class="fa-solid fa-gear"></i> Platform Global Settings</h2>

        <form id="systemSettingsForm">
            <div class="form-group" style="margin-bottom: 20px;">
                <label style="font-weight: 700; display: block; margin-bottom: 8px;">Base Commission Rate (%)</label>
                <input type="number" value="10" class="search-bar" style="max-width: 100%;" required>
            </div>

            <div class="form-group" style="margin-bottom: 20px;">
                <label style="font-weight: 700; display: block; margin-bottom: 8px;">Driver Cancellation Fee (₹)</label>
                <input type="number" value="25" class="search-bar" style="max-width: 100%;" required>
            </div>

            <button type="submit" class="btn-action btn-approve" style="padding: 12px 24px; font-size: 14px;">Save Settings</button>
        </form>
    </section>
</body>
</html>
