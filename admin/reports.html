<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports & Analytics - Smart Rideshare SuperAdmin</title>
    <link rel="stylesheet" href="../assets/css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="logo">
            <h2>Smart<span>Rideshare</span></h2>
        </div>
        <div class="admin-profile">
            <img src="../assets/images/profile.jpg" alt="Admin Profile">
            <div>
                <h3>Super Admin</h3>
                <p>Analytics & Reports</p>
            </div>
        </div>
    </header>

    <section>
        <h2><i class="fa-solid fa-chart-line"></i> Platform System Reports</h2>

        <div class="cards">
            <div class="card">
                <i class="fa-solid fa-file-invoice-dollar"></i>
                <h2>₹1,45,200</h2>
                <p>Total Monthly Revenue</p>
            </div>
            <div class="card">
                <i class="fa-solid fa-car"></i>
                <h2>1,240</h2>
                <p>Total Completed Rides</p>
            </div>
            <div class="card">
                <i class="fa-solid fa-user-xmark"></i>
                <h2>12</h2>
                <p>Cancelled Bookings</p>
            </div>
            <div class="card">
                <i class="fa-solid fa-star"></i>
                <h2>4.8 / 5</h2>
                <p>Average Satisfaction</p>
            </div>
        </div>
    </section>
</body>
</html>
