<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>RideShare - Register</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f1f5f9;
        }

        .register-box {
            width: 420px;
            max-width: 92%;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.12);
        }

        .register-box h1 {
            text-align: center;
            color: #2563eb;
            margin-bottom: 8px;
        }

        .register-box .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #334155;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }

        button:hover {
            background: #1d4ed8;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-weight: 600;
            min-height: 22px;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #64748b;
        }

        .login-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

    </style>

</head>


<body>


<div class="register-box">

    <h1>🚖 RideShare</h1>

    <p class="subtitle">
        Create your account
    </p>


    <form id="registerForm">


        <div class="form-group">

            <label for="name">
                Full Name
            </label>

            <input
                type="text"
                id="name"
                placeholder="Enter your name"
                required
            >

        </div>


        <div class="form-group">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter email"
                required
            >

        </div>


        <div class="form-group">

            <label for="phone">
                Phone
            </label>

            <input
                type="tel"
                id="phone"
                placeholder="Enter phone number"
            >

        </div>


        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Create password"
                required
            >

        </div>


        <div class="form-group">

            <label for="role">
                Account Type
            </label>

            <select id="role">

                <option value="rider">
                    Rider
                </option>

                <option value="driver">
                    Driver
                </option>

            </select>

        </div>


        <button type="submit">

            Create Account

        </button>


    </form>


    <div id="message"></div>


    <div class="login-link">

        Already have an account?

        <a href="login.html">
            Login
        </a>

    </div>

</div>



<script>

"use strict";


const API_URL =
    "http://localhost:3000";


const registerForm =
    document.getElementById(
        "registerForm"
    );


const message =
    document.getElementById(
        "message"
    );


registerForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const name =
            document.getElementById(
                "name"
            ).value.trim();


        const email =
            document.getElementById(
                "email"
            ).value.trim();


        const phone =
            document.getElementById(
                "phone"
            ).value.trim();


        const password =
            document.getElementById(
                "password"
            ).value;


        const role =
            document.getElementById(
                "role"
            ).value;


        message.textContent =
            "Creating account...";


        message.style.color =
            "#2563eb";


        try {

            const response =
                await fetch(

                    API_URL +
                    "/api/auth/register",

                    {

                        method:
                            "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                name:
                                    name,

                                email:
                                    email,

                                phone:
                                    phone,

                                password:
                                    password,

                                role:
                                    role

                            })

                    }

                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.message ||
                    "Registration failed."
                );

            }


            message.textContent =
                "✅ Account created successfully!";


            message.style.color =
                "#16a34a";


            registerForm.reset();


            setTimeout(
                function() {

                    window.location.href =
                        "login.html";

                },
                1500
            );


        }

        catch(error) {

            console.error(
                "Registration error:",
                error
            );


            message.textContent =
                "❌ " +
                error.message;


            message.style.color =
                "#dc2626";

        }

    }
);

</script>


</body>

</html>
