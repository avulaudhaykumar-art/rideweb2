<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Smart Rideshare</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="login-card" style="max-width: 500px;">
        <div class="login-header">
            <h2>Contact <span>Support</span></h2>
            <p>Have questions or feedback? Send us a message.</p>
        </div>
        <form id="contactForm">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="contactName" placeholder="Enter your full name" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="contactEmail" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label>Message</label>
                <textarea id="contactMessage" rows="4" style="width: 100%; padding: 12px; border-radius: 12px; border: 1.5px solid #cbd5e1; outline: none; font-family: inherit;" placeholder="How can we help you?" required></textarea>
            </div>
            <button type="submit" class="btn-login">Send Message</button>
        </form>
    </div>
</body>
</html>
