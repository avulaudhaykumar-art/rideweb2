<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | Ride Sharing System</title>

<link rel="stylesheet" href="../assets/css/login.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="container">

<div class="left">

<h1>Smart Ride Sharing</h1>

<p>Secure Login Portal</p>

<img src="https://images.unsplash.com/photo-1519643381401-22c77e60520e?w=1200" alt="Login Image">

</div>

<div class="right">

<div class="login-box">

<h2>Login</h2>

<p>Select your role and login</p>

<form>

<div class="inputBox">

<label>Role</label>

<select id="role">
<option>Rider</option>
<option>Driver</option>
<option>Admin</option>
<option>Super Admin</option>
</select>

</div>

<div class="inputBox">

<label>Email</label>

<input
type="email"
placeholder="Enter Email"
required>

</div>

<div class="inputBox">

<label>Password</label>

<input
type="password"
placeholder="Enter Password"
required>

</div>

<div class="remember">

<label>
<input type="checkbox">
Remember Me
</label>

<a href="#">Forgot Password?</a>

</div>

<button
type="button"
id="loginBtn">

Login

</button>

<p class="register">
Don't have an account?
<a href="register.html">Register</a>
</p>

</form>

</div>

</div>

</div>

<script src="../assets/js/login.js"></script>

</body>

</html>
